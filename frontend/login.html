<!DOCTYPE html>
<html>
<head><title>Login</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0}
.center{display:flex;justify-content:center;align-items:center;height:calc(100vh - 60px);}
.box{background:white;width:400px;border-radius:10px;box-shadow:0 5px 20px #aaa;overflow:hidden}
h1{background:#222;color:white;text-align:center;margin:0;padding:15px}
table{width:100%;border-collapse:collapse}
td{padding:12px}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box}
button{width:100%;padding:11px;background:#007bff;color:white;border:none;border-radius:5px;font-weight:bold;cursor:pointer}
button:hover{background:#0056b3}
#msg{text-align:center;font-weight:bold}
</style>
</head>
<body>

<div id="navbar"></div>
<script src="main.js"></script>

<div class="center">
<div class="box">
<h1>Login</h1>
<table>
<tr><td>Username</td><td><input id="username" placeholder="Username"></td></tr>
<tr><td>Password</td><td><input id="password" type="password" placeholder="Password"></td></tr>
<tr><td colspan="2"><button onclick="login()">Login</button></td></tr>
<tr><td colspan="2"><p id="msg" style="color:red"></p><center><a href="signup.html">New user? Signup</a></center></td></tr>
</table>
</div>
</div>

<script>
async function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    try {
        const res = await fetch("http://localhost:3000/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if(data.token){
            localStorage.clear();
            localStorage.setItem("token", data.token);
            localStorage.setItem("username", username);
            localStorage.setItem("role", data.role);
            const role = data.role.toLowerCase();
            if(role === "vendor"){
                alert("Vendor Login Success");
                window.location.href = "view_product.html";
            } else if(role === "customer"){
                alert("Customer Login Success");
                window.location.href = "customer_view_products.html";
            } else {
                alert("Admin Login");
                window.location.href = "view_product.html";
            }
        } else {
            document.getElementById("msg").innerText = data.message || "Login Failed";
        }
    } catch (err) {
        document.getElementById("msg").innerText = "Backend not running on 3000: " + err;
    }
}
</script>
</body>
</html>

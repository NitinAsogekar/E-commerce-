<!DOCTYPE html>
<html>
<head>
<title>Profile</title>
<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
.box{background:white;margin:15px;padding:20px;border-radius:8px;box-shadow:0 2px 5px #ccc}
.btn-logout{background:#d32f2f;color:white;padding:10px 20px;border:none;border-radius:5px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>

<div id="navbar"></div>
<script src="main.js"></script>

<div class="box">
  <h2>Customer Details</h2>
  <p>Name: <b id="u"></b></p>
  <p>Role: <span id="r"></span></p>
  <p>Token: <small id="t" style="word-break:break-all;color:#888"></small></p>
  <br>
  <button class="btn-logout" onclick="logout()">Logout</button>
</div>

<div class="box">
  <h3>Wishlist</h3>
  <p id="wishlist">Loading...</p>
  <button onclick="clearWishlist()" style="background:#ccc;padding:6px 12px;border:none;border-radius:4px;cursor:pointer">Clear Wishlist</button>
</div>

<div class="box">
  <h3>Quick Links</h3>
  <a href="customer_view_products.html" style="background:#007bff;color:white;padding:8px 12px;border-radius:4px;text-decoration:none">Shop</a>
  <a href="customer_cart.html" style="background:orange;color:white;padding:8px 12px;border-radius:4px;text-decoration:none">Cart</a>
  <a href="place_order.html" style="background:green;color:white;padding:8px 12px;border-radius:4px;text-decoration:none">Orders</a>
  <a href="contact.html" style="background:#444;color:white;padding:8px 12px;border-radius:4px;text-decoration:none">Support</a>
</div>

<script>
document.getElementById("u").innerText = localStorage.getItem("username")||"Guest";
document.getElementById("r").innerText = localStorage.getItem("role")||"Customer";
document.getElementById("t").innerText = (localStorage.getItem("token")||"No token").substring(0,30)+"...";

function loadWishlist(){
  let cart = JSON.parse(localStorage.getItem("cart")||"[]");
  document.getElementById("wishlist").innerHTML = cart.length ? cart.map(p=>`• ${p.name} - Rs.${p.price}`).join("<br>") : "No items saved";
}
function clearWishlist(){
  if(confirm("Clear cart?")){
    localStorage.removeItem("cart");
    loadWishlist();
  }
}
loadWishlist();
</script>

</body>
</html>
